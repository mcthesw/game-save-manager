name: Code Style

on:
  pull_request:
  push:
    branches: ["dev"]

permissions:
  contents: read

concurrency:
  group: code-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Style & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm web:format

      - name: Run ESLint
        run: pnpm web:lint

      - name: Run TypeScript typecheck
        run: pnpm web:typecheck

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify generated HTTP API client
        run: |
          pnpm --dir apps/rgsm-gui web:generate-api
          git diff --exit-code -- \
            apps/rgsm-gui/src/api/generated \
            apps/rgsm-gui/src/api/defaultConfig.generated.ts

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
