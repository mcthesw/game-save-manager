name: Publish Release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft tag to retry, for example v1.9.0"
        type: string
        required: true

permissions:
  contents: write
  checks: read

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.source.outputs.id }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Resolve the immutable release source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-github.mjs prepare

  build:
    needs: prepare
    uses: ./.github/workflows/build-gui.yml
    with:
      source_ref: ${{ needs.prepare.outputs.sha }}
      win: true
      linux: true
      macos: true
      windows_portable_slim: true
      release_id: ${{ needs.prepare.outputs.id }}
      release_tag: ${{ inputs.tag }}
    secrets: inherit

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Publish only after checks and attachments are complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: node scripts/release-github.mjs publish
