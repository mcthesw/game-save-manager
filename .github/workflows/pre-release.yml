name: pre-release
on:
  schedule:
    - cron: '0 2 * * 1'  # 每周一凌晨2点执行
  workflow_dispatch: 
jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Github release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.RELEASE_TOKEN }}"
          automatic_release_tag: latest
          prerelease: true
          title: "Bleeding edge/前沿版本"
          files: |
            LICENSE
