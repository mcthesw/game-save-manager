name: Publish Nightly

on:
  schedule:
    # Run once every night at 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: publish-nightly
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect nightly changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.changes.outputs.should_publish }}
      reason: ${{ steps.changes.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - id: changes
        name: Check changes since latest successful nightly
        run: python scripts/should_publish_nightly.py --event-name "${{ github.event_name }}"

  create-release:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_publish == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release-metadata.outputs.release_id }}
      release_tag: ${{ steps.release-metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          RELEASE_TAG="latest"
          RELEASE_TITLE="Bleeding edge/前沿版本"

          if gh api "repos/${{ github.repository }}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api "repos/${{ github.repository }}/git/refs/tags/${RELEASE_TAG}" \
              --method PATCH \
              -f sha="${GITHUB_SHA}" \
              -F force=true >/dev/null
          else
            gh api "repos/${{ github.repository }}/git/refs" \
              --method POST \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" >/dev/null
          fi

          GENERATED_NOTES="$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            --method POST \
            -f tag_name="${RELEASE_TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq '.body')"

          if gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TITLE}" \
              --prerelease \
              --notes "${GENERATED_NOTES}" \
              --repo "${{ github.repository }}"
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TITLE}" \
              --prerelease \
              --notes "${GENERATED_NOTES}" \
              --repo "${{ github.repository }}"
          fi

          gh release upload "${RELEASE_TAG}" LICENSE --clobber --repo "${{ github.repository }}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Update release notes with changes since last stable release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_STABLE="$(gh api "repos/${{ github.repository }}/releases/latest" \
            --jq '.tag_name' \
            2>/dev/null || echo "")"

          if [ -z "$LAST_STABLE" ] || [ "$LAST_STABLE" = "null" ]; then
            echo "No stable release found, keeping auto-generated release notes."
            exit 0
          fi

          echo "Generating changelog since stable release: $LAST_STABLE"
          git fetch --tags --force --quiet
          python scripts/nightly_changelog.py \
            --stable-tag "$LAST_STABLE" \
            --output /tmp/release-notes.md

          gh release edit "latest" \
            --notes-file /tmp/release-notes.md \
            --repo "${{ github.repository }}"
      - id: release-metadata
        name: Resolve release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="latest"
          RELEASE_ID="$(gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  build-release:
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/build-gui.yml
    with:
      win: true
      linux: true
      macos: true
      windows_portable_slim: true
      release_id: ${{ needs.create-release.outputs.release_id }}
      release_tag: ${{ needs.create-release.outputs.release_tag }}
    secrets: inherit

  mark-nightly-success:
    name: Mark successful nightly
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update successful nightly baseline tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          BASELINE_TAG="latest-built"

          if gh api "repos/${{ github.repository }}/git/ref/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            gh api "repos/${{ github.repository }}/git/refs/tags/${BASELINE_TAG}" \
              --method PATCH \
              -f sha="${GITHUB_SHA}" \
              -F force=true >/dev/null
          else
            gh api "repos/${{ github.repository }}/git/refs" \
              --method POST \
              -f ref="refs/tags/${BASELINE_TAG}" \
              -f sha="${GITHUB_SHA}" >/dev/null
          fi
