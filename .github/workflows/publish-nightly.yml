name: Publish Nightly

on:
  push:
    branches:
      - dev
    paths:
      - apps/rgsm-gui/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**
      - locales/**
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release-metadata.outputs.release_id }}
      release_tag: ${{ steps.release-metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create GitHub pre-release
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: '${{ secrets.RELEASE_TOKEN }}'
          automatic_release_tag: latest
          prerelease: true
          title: 'Bleeding edge/前沿版本'
          files: |
            LICENSE
      - name: Update release notes with changes since last stable release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_STABLE="$(gh api "repos/${{ github.repository }}/releases" \
            --jq '[.[] | select(.prerelease == false and .draft == false)] | sort_by(.created_at) | last | .tag_name' \
            2>/dev/null || echo "")"

          if [ -z "$LAST_STABLE" ] || [ "$LAST_STABLE" = "null" ]; then
            echo "No stable release found, keeping auto-generated release notes."
            exit 0
          fi

          echo "Generating changelog since stable release: $LAST_STABLE"
          git fetch --tags --quiet

          CHANGELOG="$(git log "${LAST_STABLE}..HEAD" \
            --pretty=format:"- %s (%h)" \
            --no-merges)"

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No changes since last stable release."
          fi

          BODY="## Changes since last stable release (${LAST_STABLE})

${CHANGELOG}"

          gh release edit "latest" \
            --notes "$BODY" \
            --repo "${{ github.repository }}"
      - id: release-metadata
        name: Resolve release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="latest"
          RELEASE_ID="$(gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  build-release:
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/build-gui.yml
    with:
      win: true
      linux: true
      macos: true
      windows_portable_slim: true
      release_id: ${{ needs.create-release.outputs.release_id }}
      release_tag: ${{ needs.create-release.outputs.release_tag }}
    secrets: inherit
