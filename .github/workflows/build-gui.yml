name: Build GUI

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Build Windows installer artifacts"
        required: true
        type: boolean
        default: false
      build_windows_portable:
        description: "Build Windows portable artifacts"
        required: true
        type: boolean
        default: false
      build_linux:
        description: "Build Linux artifacts"
        required: true
        type: boolean
        default: false
      build_macos:
        description: "Build macOS artifacts"
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_windows:
        required: false
        type: boolean
        default: false
      build_windows_portable:
        required: false
        type: boolean
        default: false
      build_linux:
        required: false
        type: boolean
        default: false
      build_macos:
        required: false
        type: boolean
        default: false
      release_id:
        required: false
        type: string
        default: ""
      release_tag:
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_gui_matrix: ${{ steps.set-matrix.outputs.has_gui_matrix }}
    steps:
      - id: set-matrix
        run: |
          MATRIX='[]'

          if [ "${{ inputs.build_windows }}" = "true" ]; then
            MATRIX=$(jq '. + [{"platform":"windows-latest","args":""}]' <<<"$MATRIX")
          fi

          if [ "${{ inputs.build_linux }}" = "true" ]; then
            MATRIX=$(jq '. + [{"platform":"ubuntu-24.04","args":""}]' <<<"$MATRIX")
          fi

          if [ "${{ inputs.build_macos }}" = "true" ]; then
            MATRIX=$(jq '. + [{"platform":"macos-latest","args":"--target aarch64-apple-darwin"}]' <<<"$MATRIX")
          fi

          if [ "$MATRIX" = "[]" ]; then
            if [ "${{ inputs.build_windows_portable }}" = "true" ]; then
              echo "has_gui_matrix=false" >> "$GITHUB_OUTPUT"
              echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "At least one build target must be selected." >&2
            exit 1
          fi

          echo "has_gui_matrix=true" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"

  build-gui:
    if: needs.prepare-matrix.outputs.has_gui_matrix == 'true'
    needs: prepare-matrix
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libasound2-dev
      - name: Install frontend dependencies
        run: pnpm install
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          projectPath: apps/rgsm-gui
          releaseId: ${{ github.event_name == 'workflow_call' && inputs.release_id || '' }}
          args: ${{ matrix.args }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            target/release/bundle/**
            target/*/release/bundle/**
            apps/rgsm-gui/src-tauri/target/release/bundle/**
            apps/rgsm-gui/src-tauri/target/*/release/bundle/**
      - name: Fix macOS updater artifact name
        if: matrix.platform == 'macos-latest' && github.event_name == 'workflow_call' && inputs.release_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          VERSION="${TAG#v}"
          RELEASE_ID="${{ inputs.release_id }}"
          gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name | test("\\.app\\.tar\\.gz")) | "\(.id)\t\(.name)"' |
          while IFS=$'\t' read -r ASSET_ID OLD_NAME; do
            if [[ "$OLD_NAME" != *"${VERSION}"* ]]; then
              NEW_NAME="${OLD_NAME/RGSM_/RGSM_${VERSION}_}"
              gh api -X PATCH "repos/${{ github.repository }}/releases/assets/${ASSET_ID}" \
                -f name="${NEW_NAME}"
              echo "Renamed: ${OLD_NAME} -> ${NEW_NAME}"
            fi
          done

  build-portable:
    if: inputs.build_windows_portable
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build portable
        run: |
          pnpm build
          pnpm portable
        env:
          RELEASE_ID: ${{ github.event_name == 'workflow_call' && inputs.release_id || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_WIN_PORTABLE: 1
      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows-portable
          if-no-files-found: error
          path: RGSM_*_x64-portable.zip

  build-slim-portable:
    if: inputs.build_windows_portable
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build slim app
        run: pnpm tauri build --config src-tauri/tauri.slim.conf.json -- --no-default-features
        working-directory: apps/rgsm-gui
        env:
          VITE_WIN_PORTABLE: 1
      - name: Build slim portable
        run: pnpm portable
        working-directory: apps/rgsm-gui
        env:
          RELEASE_ID: ${{ github.event_name == 'workflow_call' && inputs.release_id || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RGSM_BUILD_VARIANT: slim
          VITE_WIN_PORTABLE: 1
      - name: Upload slim portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows-portable-slim
          if-no-files-found: error
          path: RGSM_*_x64-portable-slim.zip
