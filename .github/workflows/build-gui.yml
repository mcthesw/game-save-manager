name: Build GUI

on:
  workflow_dispatch:
    inputs:
      win:
        description: "Build Windows"
        type: boolean
        default: false
      linux:
        description: "Build Linux"
        type: boolean
        default: false
      macos:
        description: "Build macOS"
        type: boolean
        default: false
      windows_portable_slim:
        description: "Build Windows portable slim"
        type: boolean
        default: false
  workflow_call:
    inputs:
      win:
        type: boolean
        default: false
      linux:
        type: boolean
        default: false
      macos:
        type: boolean
        default: false
      windows_portable_slim:
        type: boolean
        default: false
      release_id:
        type: string
        default: ""
      release_tag:
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win:
    if: inputs.win
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v5
        with:
          version: latest
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install
      - uses: Swatinem/rust-cache@v2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          projectPath: apps/rgsm-gui
          releaseId: ${{ github.event_name == 'workflow_call' && inputs.release_id || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: gui-win-${{ github.run_id }}
          if-no-files-found: error
          path: target/release/bundle/**

  build-linux:
    if: inputs.linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v5
        with:
          version: latest
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libasound2-dev
      - run: pnpm install
      - uses: Swatinem/rust-cache@v2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          projectPath: apps/rgsm-gui
          releaseId: ${{ github.event_name == 'workflow_call' && inputs.release_id || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: gui-linux-${{ github.run_id }}
          if-no-files-found: error
          path: target/release/bundle/**

  build-macos:
    if: inputs.macos
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v5
        with:
          version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: pnpm install
      - uses: Swatinem/rust-cache@v2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          projectPath: apps/rgsm-gui
          releaseId: ${{ github.event_name == 'workflow_call' && inputs.release_id || '' }}
          args: --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: gui-macos-${{ github.run_id }}
          if-no-files-found: error
          path: target/aarch64-apple-darwin/release/bundle/**
      - name: Fix macOS updater artifact name
        if: github.event_name == 'workflow_call' && inputs.release_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          VERSION="${TAG#v}"
          RELEASE_ID="${{ inputs.release_id }}"
          gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name | test("\\.app\\.tar\\.gz")) | "\(.id)\t\(.name)"' |
          while IFS=$'\t' read -r ASSET_ID OLD_NAME; do
            if [[ "$OLD_NAME" != *"${VERSION}"* ]]; then
              NEW_NAME="${OLD_NAME/RGSM_/RGSM_${VERSION}_}"
              gh api -X PATCH "repos/${{ github.repository }}/releases/assets/${ASSET_ID}" \
                -f name="${NEW_NAME}"
              echo "Renamed: ${OLD_NAME} -> ${NEW_NAME}"
            fi
          done

  build-windows-portable-slim:
    if: inputs.windows_portable_slim
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v5
        with:
          version: latest
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install
      - uses: Swatinem/rust-cache@v2
      - name: Build slim app
        run: pnpm tauri build --config src-tauri/tauri.slim.conf.json -- --no-default-features
        working-directory: apps/rgsm-gui
        env:
          VITE_WIN_PORTABLE: 1
      - name: Build slim portable
        run: pnpm portable
        env:
          RELEASE_ID: ${{ github.event_name == 'workflow_call' && inputs.release_id || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RGSM_BUILD_VARIANT: slim
          VITE_WIN_PORTABLE: 1
      - uses: actions/upload-artifact@v7
        with:
          name: gui-windows-portable-slim-${{ github.run_id }}
          if-no-files-found: error
          path: RGSM_*_x64-portable-slim.zip
