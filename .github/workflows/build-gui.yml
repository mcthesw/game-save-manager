name: Build GUI

on:
  workflow_dispatch:
    inputs:
      win:
        description: "Build Windows"
        type: boolean
        default: false
      linux:
        description: "Build Linux"
        type: boolean
        default: false
      macos:
        description: "Build macOS"
        type: boolean
        default: false
      macos_archive:
        description: "Include macOS app archive"
        type: boolean
        default: false
      windows_portable_slim:
        description: "Build Windows portable slim"
        type: boolean
        default: false
      artifact_prefix:
        description: "Workflow artifact name prefix"
        type: string
        default: stable
  workflow_call:
    inputs:
      win:
        type: boolean
        default: false
      linux:
        type: boolean
        default: false
      macos:
        type: boolean
        default: false
      macos_archive:
        type: boolean
        default: false
      windows_portable_slim:
        type: boolean
        default: false
      artifact_prefix:
        type: string
        default: stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win:
    if: inputs.win
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          version: latest
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install
      - uses: Swatinem/rust-cache@v2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: pnpm tauri
          projectPath: apps/rgsm-gui
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-windows
          path: |
            target/release/bundle/nsis/RGSM_*_x64-setup.exe
            target/release/bundle/nsis/RGSM_*_x64-setup.exe.sig
            target/release/bundle/msi/RGSM_*_x64_en-US.msi
            target/release/bundle/msi/RGSM_*_x64_en-US.msi.sig
          if-no-files-found: error

  build-linux:
    if: inputs.linux
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          version: latest
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libasound2-dev
      - run: pnpm install
      - uses: Swatinem/rust-cache@v2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: pnpm tauri
          projectPath: apps/rgsm-gui
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-linux
          path: |
            target/release/bundle/deb/RGSM_*.deb
            target/release/bundle/rpm/RGSM-*.rpm
            target/release/bundle/appimage/RGSM_*.AppImage
            target/release/bundle/appimage/RGSM_*.AppImage.sig
          if-no-files-found: error

  build-macos:
    if: inputs.macos
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: pnpm install
      - uses: Swatinem/rust-cache@v2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: pnpm tauri
          projectPath: apps/rgsm-gui
          args: --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-macos
          path: target/aarch64-apple-darwin/release/bundle/dmg/RGSM_*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: inputs.macos_archive
        with:
          name: ${{ inputs.artifact_prefix }}-macos-archive
          path: target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error

  build-windows-portable-slim:
    if: inputs.windows_portable_slim
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          version: latest
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install
      - uses: Swatinem/rust-cache@v2
      - name: Build slim app
        run: pnpm tauri build --config src-tauri/tauri.slim.conf.json -- --no-default-features
        working-directory: apps/rgsm-gui
        env:
          VITE_WIN_PORTABLE: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Build slim portable
        run: pnpm portable
        env:
          RGSM_BUILD_VARIANT: slim
          VITE_WIN_PORTABLE: 1
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-portable
          path: RGSM_*_x64-portable-slim.zip
          if-no-files-found: error
