name: Code Tests

on:
  pull_request:
  push:
    branches: ["dev"]

permissions:
  contents: read

concurrency:
  group: code-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run script tests
        run: python scripts/nightly_changelog_test.py

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Run portable script tests
        run: node --test scripts/portable.test.mjs

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm web:test

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run configuration upgrade compatibility tests
        run: cargo test -p rgsm-core --test config_upgrade_compatibility

      - name: Run Fs cloud sync domain tests
        run: cargo test -p rgsm-core --test cloud_sync_v2_fs

      - name: Run workspace checks
        run: |
          cargo check --workspace
          cargo test -p rgsm-core --lib

      - name: Run slim build checks
        run: |
          cargo check -p rgsm-core --no-default-features
          cargo test -p rgsm-core --no-default-features --lib

  gui-cloud-fs-e2e-shard:
    name: GUI Cloud Fs E2E (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config \
            xvfb \
            dbus-x11

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate frontend API
        run: pnpm --dir apps/rgsm-gui web:generate-api

      - name: Install Playwright Chromium
        run: pnpm --dir apps/rgsm-gui exec playwright install chromium --with-deps

      # The debug "host" is the full Tauri app in host-only mode; GTK and the
      # tray stack still initialize, so the suite needs a virtual display.
      - name: Run GUI Cloud Fs E2E
        run: xvfb-run -a pnpm web:e2e --shard=${{ matrix.shard }}/2

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-cloud-fs-e2e-${{ matrix.shard }}
          path: |
            apps/rgsm-gui/e2e-report
            apps/rgsm-gui/e2e-results
          if-no-files-found: ignore

  gui-cloud-fs-e2e:
    name: GUI Cloud Fs E2E
    needs: gui-cloud-fs-e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all E2E shards to pass
        env:
          SHARD_RESULT: ${{ needs.gui-cloud-fs-e2e-shard.result }}
        run: test "$SHARD_RESULT" = success
