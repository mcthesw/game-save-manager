[package]
name = "rgsm"
default-run = "rgsm"
version.workspace = true
description = "A user friendly game save manager"
authors = ["Sworld"]
license.workspace = true
repository = ""
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rgsm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["bundled-manifest"]
bundled-manifest = ["rgsm-core/bundled-manifest"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
rgsm-core.workspace = true
serde_json.workspace = true
serde.workspace = true
log.workspace = true
tauri = { version = "2.11.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2.8.0"
rust-i18n.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
specta.workspace = true
rodio = { version = "0.18.1", features = ["flac", "mp3", "vorbis"] }
async-trait.workspace = true
open.workspace = true
chrono = "0.4.44"
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
utoipa = { version = "5", features = ["axum_extras"] }
rand = "0.9"
rfd = "0.17"
tokio-stream = "0.1"
subtle = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-window-state = "2.4.1"

[target.'cfg(windows)'.dependencies]
winreg.workspace = true
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
criterion.workspace = true
temp-dir.workspace = true
zip.workspace = true

[[bench]]
name = "compression_algorithms"
harness = false
