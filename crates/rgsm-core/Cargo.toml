[package]
name = "rgsm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Core library for Game Save Manager — backup, config, cloud sync, and hook pipeline"
license.workspace = true

[lib]
name = "rgsm_core"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
log.workspace = true
anyhow.workspace = true
semver = "1.0.26"
thiserror.workspace = true
chrono = "0.4.40"
tokio.workspace = true
tokio-util.workspace = true
opendal = { version = "0.54.0", features = ["services-webdav", "services-s3"] }
zip.workspace = true
fs_extra = "1.3.0"
filetime = "0.2"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
open.workspace = true
temp-dir.workspace = true
notify-rust = "4.11.5"
hostname = "0.4.0"
dirs = "6.0.0"
whoami = "1.6.0"
machine-uid = "0.5.3"
reqwest = "0.12"
lazy_static = "1.5"
rust-embed = { version = "8.9.0", features = ["compression", "debug-embed", "include-exclude"] }
font-kit = "0.14"
base64 = "0.22.1"
async-trait.workspace = true
specta.workspace = true
rust-i18n.workspace = true

[target.'cfg(windows)'.dependencies]
winreg.workspace = true

